name: YouTube Subtitle Cloud Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Compare firecrawl v1 vs v2 on YouTube
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python - <<'PYEOF'
          import os, requests
          key = os.environ["FIRECRAWL_API_KEY"]
          URL = "https://www.youtube.com/watch?v=fsTtKywmWlU"
          cases = {
              "v1 main": ("https://api.firecrawl.dev/v1/scrape", {"onlyMainContent": True}),
              "v1 full": ("https://api.firecrawl.dev/v1/scrape", {"onlyMainContent": False}),
              "v2 main": ("https://api.firecrawl.dev/v2/scrape", {"onlyMainContent": True}),
              "v2 full": ("https://api.firecrawl.dev/v2/scrape", {"onlyMainContent": False}),
          }
          for name, (api, opts) in cases.items():
              try:
                  r = requests.post(api, timeout=90,
                      headers={"Authorization": f"Bearer {key}"},
                      json={"url": URL, "formats": ["markdown"], **opts})
                  md = ((r.json().get("data") or {}).get("markdown") or "") if r.ok else ""
                  has = "## Transcript" in md
                  print(f"RESULT {name}: HTTP {r.status_code} | {len(md)}자 | Transcript {'✅' if has else '❌'}")
                  if not r.ok:
                      print("   응답:", r.text[:150])
              except Exception as e:
                  print(f"RESULT {name}: 예외 {e}")
          PYEOF
