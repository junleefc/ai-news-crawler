name: YouTube Subtitle Cloud Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Try every player client
        run: |
          python - <<'PYEOF'
          import subprocess, tempfile, glob, os
          URL = "https://www.youtube.com/watch?v=fsTtKywmWlU"
          base = ["yt-dlp", "--skip-download", "--write-subs", "--write-auto-subs",
                  "--sub-langs", "en.*", "--sub-format", "vtt"]
          variants = {
              "tv": ["--extractor-args", "youtube:player_client=tv"],
              "tv_embedded": ["--extractor-args", "youtube:player_client=tv_embedded"],
              "ios": ["--extractor-args", "youtube:player_client=ios"],
              "mweb": ["--extractor-args", "youtube:player_client=mweb"],
              "web_embedded": ["--extractor-args", "youtube:player_client=web_embedded"],
              "web_safari": ["--extractor-args", "youtube:player_client=web_safari"],
              "mweb+chrome위장": ["--extractor-args", "youtube:player_client=mweb",
                                   "--impersonate", "chrome"],
              "tv+chrome위장": ["--extractor-args", "youtube:player_client=tv",
                                 "--impersonate", "chrome"],
          }
          winners = []
          for name, extra in variants.items():
              with tempfile.TemporaryDirectory() as td:
                  r = subprocess.run(base + extra + ["-o", f"{td}/s", URL],
                                     capture_output=True, timeout=120, text=True)
                  vtts = glob.glob(f"{td}/s*.vtt")
                  size = os.path.getsize(vtts[0]) if vtts else 0
                  tail = (r.stderr or "").strip().splitlines()[-1][:90] if r.stderr else ""
                  print(f"RESULT {name}: {'✅ ' + str(size) + 'B' if size > 1000 else '❌ ' + tail}")
                  if size > 1000:
                      winners.append(name)
          print(f"\n=== 성공한 클라이언트: {winners or '없음'} ===")
          PYEOF
