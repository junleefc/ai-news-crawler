name: YouTube Subtitle Cloud Test

# 클라우드 IP에서 유튜브 자막 추출(3단 우회 포함)이 되는지만 검사.
# 슬랙/시트는 일절 건드리지 않는다. 수동 실행 전용.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Extract subtitles (3-tier bypass)
        run: |
          python - <<'EOF'
          import fetcher
          videos = {
              "a16z (Garry Tan)": "https://www.youtube.com/watch?v=fsTtKywmWlU",
              "어제 실패했던 영상 1": "https://www.youtube.com/watch?v=EoNH3Tn8wYE",
              "어제 실패했던 영상 2": "https://www.youtube.com/watch?v=zEZ0rQ8Ef-Y",
          }
          results = {}
          for name, url in videos.items():
              t = fetcher.fetch_fulltext(url)
              results[name] = len(t)
              print(f"RESULT {name}: {len(t)}자")
          ok = sum(1 for v in results.values() if v >= 700)
          print(f"\n=== 최종: {ok}/{len(videos)} 성공 ===")
          if ok == 0:
              raise SystemExit("클라우드에서 자막 추출 전부 실패 — 우회 무력")
          EOF
