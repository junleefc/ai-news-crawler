name: YouTube Subtitle Cloud Test

# 클라우드에서 유튜브 자막 확보(yt-dlp → firecrawl 폴백)가 되는지만 검사.
# 슬랙/시트는 일절 건드리지 않는다. 수동 실행 전용.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch transcripts via full fallback chain
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python - <<'PYEOF'
          import fetcher
          videos = {
              "a16z (Garry Tan)": "https://www.youtube.com/watch?v=fsTtKywmWlU",
              "어제 실패 영상": "https://www.youtube.com/watch?v=EoNH3Tn8wYE",
          }
          ok = 0
          for name, url in videos.items():
              t = fetcher.fetch_fulltext(url)
              print(f"RESULT {name}: {len(t)}자 | {t[:80]!r}")
              ok += len(t) >= 700
          print(f"\n=== 최종: {ok}/{len(videos)} 성공 (firecrawl 사용 {fetcher.firecrawl_used()}건) ===")
          if ok == 0:
              raise SystemExit("전부 실패")
          PYEOF
