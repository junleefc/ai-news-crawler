name: YouTube Subtitle Cloud Test

# 내일 아침과 동일한 fetch_fulltext 체인(yt-dlp → firecrawl 폴백) 검증. 발송 없음.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: fetch_fulltext full chain
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python - <<'PYEOF'
          import fetcher
          videos = {
              "a16z (Garry Tan)": "https://www.youtube.com/watch?v=fsTtKywmWlU",
              "어제 실패 영상": "https://www.youtube.com/watch?v=EoNH3Tn8wYE",
          }
          ok = 0
          for name, url in videos.items():
              t = fetcher.fetch_fulltext(url)
              print(f"RESULT {name}: {len(t)}자 | {t[:70]!r}")
              ok += len(t) >= 700
          print(f"\n=== 최종: {ok}/{len(videos)} 성공 ===")
          if ok < len(videos):
              raise SystemExit("일부 실패")
          PYEOF
