# ===== 수집 (넓게) =====
lookback_hours: 28
max_per_feed: 20            # 소스당 최대 수집 (넓게)
candidate_cap: 90          # 1단계 평가에 넘길 최대 후보 수

# ===== 선별 (엄선) =====
curated_count: 30          # 최종 엄선 개수 (시트 + 슬랙)
min_insight_score: 3       # 인사이트 점수 이 값 미만 제외 (1~5)
keep_types:                # 이 유형만 통과 (나머지는 버림)
  - 심층분석
  - 오피니언·전략
  - 실전케이스

# ===== 모델 =====
# 1단계: 스니펫만 보고 유형/점수 매기는 싼 필터
filter_model: claude-haiku-4-5-20251001
# 2단계: 원문 긁어 심층요약 (품질 더 원하면 claude-sonnet-5 로 교체)
summary_model: claude-haiku-4-5-20251001
summary_language: 한국어

# ===== 저장 / 발송 =====
worksheet_name: news
slack_items_per_message: 6   # 슬랙은 여러 메시지로 분할 (긴 메시지 방지)
