# ===== 수집 (넓게) =====
lookback_hours: 28
max_per_feed: 20            # 소스당 최대 수집 (넓게)
candidate_cap: 90          # 1단계 평가에 넘길 최대 후보 수

# ===== 선별 (엄선) =====
curated_count: 30          # 최종 엄선 개수 (시트 + 슬랙)
min_insight_score: 3       # 인사이트 점수 이 값 미만 제외 (1~5)
keep_types:                # 이 유형만 통과 (나머지는 버림)
  - 심층분석
  - 오피니언·전략
  - 실전케이스

# ===== 모델 =====
# 1단계: 스니펫만 보고 유형/점수 매기는 싼 필터
filter_model: claude-haiku-4-5-20251001
# 2단계: 원문 긁어 심층요약 (품질 더 원하면 claude-sonnet-5 로 교체)
# 요약·검증 모델 (환각 수치는 검증 버그로 부풀려졌던 것 — 재측정 후 조정)
summary_model: claude-sonnet-5
verify_model: claude-sonnet-5
summary_language: 한국어

# ===== 저장 / 발송 =====
worksheet_name: news
slack_items_per_message: 6   # 슬랙은 여러 메시지로 분할 (긴 메시지 방지)

# 환각 방지: 원문을 이만큼(자) 못 긁으면 요약 안 하고 버림 (스니펫만으로 지어내기 차단)
min_body_chars: 700
title_dup_threshold: 0.6  # 제목 토큰 이만큼 겹치면 중복으로 간주
max_per_source: 4         # 한 실행에서 같은 출처 최대 건수 (편중 방지)
source_caps:              # 특정 출처만 더 낮게 (아래가 우선)
  Hacker News (AI): 2     # 한 곳 쏠림이 심해 축소 (최근 7일 143건 중 53건이었음)
  arXiv cs.AI: 2          # 논문은 소수만
firecrawl_daily_cap: 20   # 1회 실행당 firecrawl 최대 호출 (무료 월1000크레딧 보호: 20×30=600)
stale_lookback_days: 7    # 최근 N일 발송분과 비교해 '새 정보 없는 재탕' 제외

# ===== 개인화 (관심사 + 피드백 학습) =====
# 기본 관심사 (평가 데이터가 쌓이기 전 콜드스타트 + 상시 기준)
interests:
  - AI 마케팅·광고·콘텐츠 (마케터 관점 AI 활용, 광고 자동화, 콘텐츠 제작, SEO/GEO/AEO, 브랜드 가시성)
  - AI 에이전트 실무활용 (비개발자·1인기업 관점 업무 자동화, 실제 도입 사례 — 기술 구현 말고 활용법)
  - AI 비즈니스·전략·산업동향 (기업 도입 흐름, 시장·투자, 전략적 관점, 경쟁 구도)
uninterests:
  - 개발자 전용 딥테크 (코드 구현, 인프라, 모델 아키텍처 세부)
  - 단순 신모델·신기술 발표

min_fit_score: 3          # 관심 적합도(1~5) 이 값 미만 제외

# 슬랙 평가 이모지 → 평가 라벨 (5단계 + 무반응)
# 5️⃣최고 4️⃣좋음 3️⃣보통 2️⃣별로 1️⃣최악
rating_emojis:
  five: 5-최고
  four: 4-좋음
  three: 3-보통
  two: 2-별로
  one: 1-최악

# 학습 가중치 (프로필 순점수 계산용) — 양 끝을 강하게 반영
rating_weights:
  5-최고: 3
  4-좋음: 1
  3-보통: 0
  2-별로: -2
  1-최악: -4
  무반응: -0.5
feedback_wait_days: 2     # 발송 후 이 일수 지나야 '무반응' 확정
slack_channel_id: C0BFS998RTR   # #ai_insight
